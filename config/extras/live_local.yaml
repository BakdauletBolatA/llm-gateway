# Нагрузка на живую модель на CPU (docker compose --profile ollama).
#
# Отличия от базового конфига, и почему:
# - таймауты в десятки секунд: 0.5B-модель на CPU без GPU отвечает секундами, а не
#   десятками миллисекунд, как мок;
# - хеджирование выключено: бэкенд ограничен процессором, и параллельный дубль
#   запроса отнимает у него то же самое время, что и основной;
# - bulkhead: Ollama обрабатывает несколько запросов параллельно, но не больше
#   OLLAMA_NUM_PARALLEL, остальные стоят в её очереди. Лимит держит эту очередь у
#   шлюза, где ею можно управлять;
# - две попытки на провайдера вместо трёх: на перегруженном CPU лишняя попытка
#   — это ещё один запрос в ту же очередь.
reliability:
  timeouts:
    enabled: true
    connect_s: 2.0
    read_s: 45.0
    write_s: 5.0
    total_s: 60.0
  retries:
    enabled: true
    max_attempts: 2
  hedging:
    enabled: false
  bulkhead:
    enabled: true
    max_concurrent_per_provider: 4
    queue_timeout_ms: 20000
