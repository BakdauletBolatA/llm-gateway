# Лимит бюджета, который реально пробивается за один короткий прогон.
# Используется только для замера перерасхода на нескольких репликах:
#   BUDGET_SCOPE=local  ... -> каждая реплика тратит свой лимит
#   BUDGET_SCOPE=shared ... -> лимит один на деплоймент
# Кэш выключен: попадание в кэш не стоит денег и размывает замер.
budget:
  limit_usd: 0.005
  refresh_interval_s: 5.0

reliability:
  cache:
    enabled: false
  rate_limit:
    enabled: false
