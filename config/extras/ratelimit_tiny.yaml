# Лимит частоты, который реально пробивается за один короткий прогон.
# Используется только для замера «лимит принадлежит процессу или деплойменту»:
#   RATE_LIMIT_SCOPE=local  ... -> каждая реплика выдаёт полный burst
#   RATE_LIMIT_SCOPE=shared ... -> один burst на деплоймент
# Кэш выключен: попадание в кэш не стоит токена провайдера, но тратит токен
# лимита, и смешивать два эффекта в одном замере незачем.
reliability:
  cache:
    enabled: false
  rate_limit:
    enabled: true
    requests_per_second: 25
    burst: 25
