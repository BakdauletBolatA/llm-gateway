# Лимит по квоте провайдера И выключенный хедж.
#
# Хедж и лимит конкурентности мешают друг другу: отменённый дубль освобождает слот
# на нашей стороне мгновенно, а на стороне провайдера — нет (запрос там продолжает
# обслуживаться, пока не догенерирует ответ). Поэтому провайдер видит больше
# параллельных запросов, чем разрешает наш лимит, и продолжает отдавать 503.
reliability:
  bulkhead:
    enabled: true
    max_concurrent_per_provider: 2
    queue_timeout_ms: 2000
  hedging:
    enabled: false
