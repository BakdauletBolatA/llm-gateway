# Лимит конкурентности выставлен ПО КВОТЕ ПРОВАЙДЕРА (в профиле capacity_limited
# апстрим обслуживает 2 запроса одновременно). Так это и настраивается в проде:
# из документированной квоты провайдера, а не из общих соображений.
reliability:
  bulkhead:
    enabled: true
    max_concurrent_per_provider: 2
    queue_timeout_ms: 2000
