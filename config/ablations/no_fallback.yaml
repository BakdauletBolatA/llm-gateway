# Финальная конфигурация без fallback: используется только первое звено цепочки.
#
# Хеджирование выключено вынужденно: хеджировать нечем, второго звена в цепочке
# больше нет. Конфиг с hedging.enabled и fallback.enabled: false шлюз не примет —
# это ошибка конфигурации, а не рабочий режим.
reliability:
  fallback:
    enabled: false
  hedging:
    enabled: false
