# Итерация 7 — хеджирование запросов (tail-latency hedging).
#
# Все предыдущие механизмы лечат ОТКАЗЫ. Ни один из них не помогает, когда
# провайдер работает, но отвечает через три секунды: ретрай ждёт своей очереди,
# брейкер не видит ошибок, fallback не срабатывает — ошибки-то нет.
#
# Хедж: если первое звено молчит дольше delay_ms, параллельно запускается второе,
# и запрос завершает тот, кто ответил первым; проигравший отменяется.
#
# delay_ms — единственный настоящий параметр этого механизма:
#   слишком мало — дублируется весь трафик и провайдеры получают вдвое больше нагрузки;
#   слишком много — хедж не успевает до дедлайна и смысла в нём нет.
# 400 мс выбраны выше нормального p95 (латентность мока 40–120 мс, p95 под
# нагрузкой ~130 мс), то есть дублируется только медленный хвост.
#
# max_in_flight: 2 — параллельно живут максимум два звена. Три и больше — это уже
# веерная рассылка запроса всем провайдерам сразу, с соответствующим счётом.
reliability:
  timeouts:
    enabled: true
  retries:
    enabled: true
  circuit_breaker:
    enabled: true
    retry_after_is_backpressure: false
  fallback:
    enabled: true
    max_providers: 3
  hedging:
    enabled: true
    delay_ms: 400
    max_in_flight: 2
  bulkhead:
    enabled: false
  rate_limit:
    enabled: false
  cache:
    enabled: true
    similarity_threshold: 0.60
