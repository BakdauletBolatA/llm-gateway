name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy

  test:
    name: pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector is required by the semantic cache migration.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: llm_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d llm_gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://gateway:gateway@127.0.0.1:5432/llm_gateway_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and end-to-end tests
        run: python -m pytest -q

  chaos-smoke:
    name: chaos smoke run
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: llm_gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d llm_gateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@127.0.0.1:5432/llm_gateway
      MOCK_BASE_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Create the venv the stack script expects
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Chaos smoke run
        run: ./scripts/ci_smoke.sh
      - name: Upload chaos results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-smoke-results
          path: bench/ci/
          if-no-files-found: warn
      - name: Gateway and mock logs on failure
        if: failure()
        run: tail -n 200 .run/*.log || true

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file
        run: docker compose config --quiet
      - name: Validate the ollama profile
        run: docker compose --profile ollama config --quiet
      - name: Validate the replica profile
        run: docker compose --profile replica config --quiet
