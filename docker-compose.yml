# docker compose up  -> postgres + mock provider + gateway.
# Работает без единого платного ключа: маршрут chaos-default ходит только в мок.
#
# Ollama выключена по умолчанию (образ и модель весят гигабайты):
#   OLLAMA_ENABLED=true docker compose --profile ollama up
# Модель по умолчанию — qwen2.5:0.5b (около 400 МБ, работает на CPU). Маршруты
# local-only и live-local ходят в неё; live-local — через два сервера Ollama.

name: llm-gateway

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: llm_gateway
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d llm_gateway"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock:
    build: .
    command:
      - uvicorn
      - mock_provider.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8081"
    environment:
      PORT: "8081"
      FAILURE_PROFILES: config/failure_profiles.yaml
      MOCK_SCENARIO: ${MOCK_SCENARIO:-healthy}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${MOCK_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build: .
    environment: &gateway_env
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@postgres:5432/llm_gateway
      MOCK_BASE_URL: http://mock:8081
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_SECONDARY_BASE_URL: http://ollama-secondary:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      GATEWAY_CONFIG: ${GATEWAY_CONFIG:-config/gateway.yaml}
      GATEWAY_CONFIG_OVERLAY: ${GATEWAY_CONFIG_OVERLAY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # Лимиты: local — счётчик в памяти процесса, shared — строка в Postgres.
      # По умолчанию поднимается одна реплика, и local для неё правильный. Обе
      # переменные нужно перевести в shared, если реплик больше одной, — см.
      # профиль replica ниже.
      RATE_LIMIT_SCOPE: ${RATE_LIMIT_SCOPE:-local}
      BUDGET_SCOPE: ${BUDGET_SCOPE:-local}
      # Реальные провайдеры включаются только если ключи заданы в .env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_ENABLED: ${ANTHROPIC_ENABLED:-false}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mock:
        condition: service_healthy

  # --- профиль replica: вторая реплика на том же Postgres ---
  # Ради одного вопроса, который на одном процессе не задать: лимит принадлежит
  # процессу или деплойменту? Замеры — RELIABILITY.md, «Лимит, когда реплик
  # больше одной» и итерация 11.
  #
  #   RATE_LIMIT_SCOPE=shared BUDGET_SCOPE=shared \
  #     docker compose --profile replica up -d
  #   python scripts/shared_limit_probe.py \
  #     --gateway http://127.0.0.1:8080 --gateway http://127.0.0.1:8082
  gateway-replica:
    build: .
    profiles: ["replica"]
    environment: *gateway_env
    ports:
      - "${GATEWAY_REPLICA_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mock:
        condition: service_healthy

  # --- профиль ollama: локальная модель без единого платного ключа ---
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Второй сервер на тех же весах: нагрузочный тест останавливает первый и
  # проверяет, что шлюз переключается на живую модель, а не на мок. Том общий,
  # поэтому модель скачивается один раз.
  ollama-secondary:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "${OLLAMA_SECONDARY_PORT:-11435}:11434"
    volumes:
      - ollama:/root/.ollama
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:0.5b}"]
    restart: "no"

volumes:
  pgdata:
  ollama:
